[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiowave-ai"
version = "0.1.0"
description = "Synthetic ECG rhythm classification research toolkit"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=1.5,<4", "scikit-learn>=1.3,<2", "scipy>=1.10,<2", "joblib>=1.2,<2", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4,<5", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[project.scripts]
healthcare-ai = "healthcare_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
